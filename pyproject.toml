[tool.poetry]
name = "trading-bot-backend"
version = "0.1.0"
description = "EUR/USD 30-second signal simulator backend"
authors = ["Trading Bot Team <dev@example.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic-settings = "^2.2.1"
jinja2 = "^3.1.0"
pandas = "^2.2.0"
pyarrow = "^15.0.0"
numpy = "^1.26.0"
requests = "^2.31.0"
python-dateutil = "^2.9.0"
tenacity = "^8.2.0"
duka = "^0.2.3"
SQLAlchemy = "^2.0.0"
psycopg = {version = "^3.1.18", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
